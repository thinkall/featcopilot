name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install supported Copilot SDK for adapter tests
        if: matrix.python-version != '3.10'
        run: pip install -e ".[llm]"

      - name: Check package types
        run: python -m mypy featcopilot

      - name: Run tests with coverage
        if: matrix.python-version != '3.10'
        run: |
          pytest tests/ -v --cov=featcopilot --cov-report=xml --cov-report=term-missing

      - name: Prepare Python 3.10 native crash diagnostics
        if: matrix.python-version == '3.10'
        run: |
          if ! command -v gdb >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq gdb
          fi

      - name: Diagnose Python 3.10 native optimizer
        if: matrix.python-version == '3.10'
        env:
          OPENBLAS_CORETYPE: HASWELL
        run: |
          python -c "import numpy, scipy.linalg; from threadpoolctl import threadpool_info; print(threadpool_info())"
          gdb --batch --return-child-result -ex "set pagination off" -ex run -ex "thread apply all bt" --args python -m pytest tests/test_predictive_logistic_workers.py -q
          gdb --batch --return-child-result -ex "set pagination off" -ex run -ex "thread apply all bt" --args python -m pytest tests/ -v --cov=featcopilot --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: unittests
          name: featcopilot-py${{ matrix.python-version }}
